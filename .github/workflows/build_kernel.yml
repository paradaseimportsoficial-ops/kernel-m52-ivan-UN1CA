name: Compilar KernelSU Next v3.3.0 - M52 5G

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilando Kernel M52 5G
    runs-on: ubuntu-latest
    steps:
      - name: Maximizar Espaço em Disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Baixar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libbison-dev flex libelf-dev zip bison git ccache curl wget python3

      - name: Baixar Repositório do Usuário (com o boot.img)
        uses: actions/checkout@v4

      - name: Integrar KernelSU Next v3.3.0 Diretamente
        run: |
          echo "Verificando o boot.img..."
          ls -la boot.img
          
          # Baixa a ferramenta magiskboot oficial (usada para desempacotar boot.img perfeitamente no Linux)
          mkdir -p work
          cd work
          wget https://github.com/topjohnwu/Magisk/releases/download/v26.4/Magisk-v26.4.apk -O magisk.zip
          unzip -q magisk.zip
          
          # Pega o binário magiskboot compatível com x86_64 Linux
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot
          
          # Copia o boot.img para a pasta de trabalho
          cp ../boot.img ./boot.img
          
          echo "Desempacotando boot.img com magiskboot..."
          ./magiskboot unpack boot.img
          
          # Aplica o KernelSU Next v3.3.0 no kernel extraído (kernel)
          echo "Aplicando KernelSU Next v3.3.0..."
          curl -LSs "https://raw.githubusercontent.com/rifs3/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.3.0
          
          # Se o setup do KSU gerar um kernel modificado, recompila ou injeta na imagem
          # Repacota a imagem de boot modificada
          ./magiskboot repack boot.img
          
          cd ..
          mkdir -p output
          cp work/new-boot.img output/boot-ksu-next.img

      - name: Upload do Boot Modificado com KSU Next
        uses: actions/upload-artifact@v4
        with:
          name: Boot-M52-KernelSU-Next-v3.3.0
          path: output/boot-ksu-next.img
