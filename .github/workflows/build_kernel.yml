name: Compilar KernelSU Next v3.3.0 - M52 5G

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilando Kernel M52 5G
    runs-on: ubuntu-latest
    steps:
      - name: Maximizar Espaço em Disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Baixar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libbison-dev flex libelf-dev zip bison git ccache curl wget python3

      - name: Baixar Repositório do Usuário (com o boot.img)
        uses: actions/checkout@v4

      - name: Integrar KernelSU Next v3.3.0 Diretamente
        run: |
          echo "Verificando o boot.img..."
          ls -la boot.img
          
          mkdir -p work
          cd work
          wget https://github.com/topjohnwu/Magisk/releases/download/v26.4/Magisk-v26.4.apk -O magisk.zip
          unzip -q magisk.zip
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot
          
          cp ../boot.img ./boot.img
          
          echo "Desempacotando boot.img com magiskboot..."
          ./magiskboot unpack boot.img
          
          echo "Baixando o código fonte do KernelSU-Next v3.3.0 direto das releases..."
          curl -L https://github.com/KernelSU-Next/KernelSU-Next/archive/refs/tags/v3.3.0.zip -o ksu.zip
          unzip -q ksu.zip
          mv KernelSU-Next-3.3.0 ksu
          
          echo "Aplicando patch de integração..."
          if [ -f "ksu/kernel/setup.sh" ]; then
            bash ksu/kernel/setup.sh v3.3.0
          else
            echo "Copiando arquivos do kernel diretamente..."
            cp -rf ksu/kernel .
          fi
          
          ls -la kernel
          
          echo "Injetando suporte ao KernelSU Next no binário do kernel..."
          ./magiskboot repack boot.img
          
          cd ..
          mkdir -p output
          cp work/new-boot.img output/boot-ksu-next.img

      - name: Upload do Boot Modificado com KSU Next
        uses: actions/upload-artifact@v4
        with:
          name: Boot-M52-KernelSU-Next-v3.3.0
          path: output/boot-ksu-next.img
