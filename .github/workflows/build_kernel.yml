name: Compilar KernelSU Next v3.3.0 - M52 5G

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilando Kernel M52 5G
    runs-on: ubuntu-latest
    steps:
      - name: Maximizar Espaço em Disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Baixar Dependências e Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libbison-dev flex libelf-dev zip bison git ccache curl wget python3
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git aik || git clone https://github.com/crdroidandroid/android_tools_samsung_aik.git aik

      - name: Baixar Repositório do Usuário (com o boot.img)
        uses: actions/checkout@v4

      - name: Integrar KernelSU Next v3.3.0 e Empacotar
        run: |
          echo "Verificando se o boot.img está presente..."
          ls -la boot.img
          
          mkdir -p aik/split_img
          cp boot.img aik/split_img/boot.img
          
          cd aik
          ./unpackimg.sh --local
          
          curl -LSs "https://raw.githubusercontent.com/rifs3/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.3.0
          
          ./repackimg.sh
          
          cd ..
          mkdir -p output
          cp aik/image-new.img output/boot-ksu-next.img

      - name: Upload do Boot Modificado com KSU Next
        uses: actions/upload-artifact@v4
        with:
          name: Boot-M52-KernelSU-Next-v3.3.0
          path: output/boot-ksu-next.img
