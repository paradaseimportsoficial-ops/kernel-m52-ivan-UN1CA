name: Compilar KernelSU Next v3.3.0 - M52 5G

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilando Kernel M52 5G
    runs-on: ubuntu-latest
    steps:
      - name: Maximizar Espaço em Disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Baixar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libbison-dev flex libelf-dev zip bison git ccache curl wget python3 unzip

      - name: Baixar Repositório do Usuário (com o boot.img)
        uses: actions/checkout@v4

      - name: Baixar Ferramentas e Integrar KernelSU Next v3.3.0
        run: |
          echo "Baixando e configurando o AIK..."
          wget https://github.com/osm0sis/Android-Image-Kitchen/archive/refs/heads/master.zip -O aik.zip
          unzip -q aik.zip
          
          # Encontra a pasta extraída (que pode ter um nome variado) e move tudo para 'aik'
          mkdir -p aik
          cp -r Android-Image-Kitchen-master/* aik/
          
          # Move o boot.img para a pasta aik
          cp boot.img aik/boot.img
          
          # Agora garantimos que estamos dentro da pasta antes de qualquer coisa
          cd aik
          echo "Conteúdo da pasta aik:"
          ls -la
          
          chmod +x *.sh
          ./unpackimg.sh boot.img
          
          # Aplica o KernelSU Next
          curl -LSs "https://raw.githubusercontent.com/rifs3/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.3.0
          
          ./repackimg.sh
          
          cd ..
          mkdir -p output
          cp aik/image-new.img output/boot-ksu-next.img

      - name: Upload do Boot Modificado com KSU Next
        uses: actions/upload-artifact@v4
        with:
          name: Boot-M52-KernelSU-Next-v3.3.0
          path: output/boot-ksu-next.img
